<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot Password</title>
</head>
<body>

<h1>Forgot Password</h1>

<form action="/forgotPassword" method="post">

    <label>Email:</label>

    <input type="email"
           name="email"
           required>

    <br><br>

    <button type="submit">
        Submit
    </button>

</form>

<br>

<p th:text="${message}"></p>

<br>

<a href="/login">
    Back to Login
</a>

</body>
</html>
